if(w.status!==409&&w.status!==422)throw new Error(w.status===403||w.status===404?'token needs Contents: read and write':'GitHub error '+w.status)}

const p=busy.then(run);busy=p.catch(()=>{});return p}
const ghSet=(id,data)=>{if(!cfg().token)throw new Error('connect GitHub first (⚙)');return mutate(l=>{const i=l.findIndex(x=>x.id===id),it={id,...data};i<0?l.push(it):l[i]=it;return l})};
const ghDelete=id=>{if(!cfg().token)throw new Error('connect GitHub first (⚙)');return mutate(l=>l.filter(x=>x.id!==id))};
const photoCache={};
async function ghPhoto(blob){if(!cfg().token)throw new Error('connect GitHub first (⚙)');
const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(blob)});
const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const w=await api('photos/'+id+'.jpg',{method:'PUT',body:JSON.stringify({message:'Add photo',content:data})});
if(!w.ok)throw new Error('GitHub error '+w.status);photoCache[id]=Promise.resolve(URL.createObjectURL(blob));return id}
function phImg(id){const im=el('img',{alt:''});
(photoCache[id]||(photoCache[id]=api('photos/'+id+'.jpg',{headers:RAW}).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>URL.createObjectURL(b)))).then(u=>im.src=u).catch(()=>{delete photoCache[id]});return im}
const setSync=t=>$('sync').textContent=t;
async function pull(){if(!cfg().repo||!cfg().token)return'not connected';
try{const list=await ghLoad();items=new Map(list.map(x=>[x.id,x]));setSync('● synced');const cur=sel;refresh();if(cur&&cur.id&&!items.has(cur.id)){sel.id=null;renderPanel()}return''}
catch(e){setSync('not synced · '+e.message);return e.message}}
let polling=false;
function startPoll(){if(polling)return;polling=true;setInterval(()=>{if(!document.hidden)pull()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()})}
function openSetup(){const c=cfg(),box=$('setup'),st=el('div',{class:'st'});
const r=el('input',{type:'text',value:c.repo,placeholder:'your-username/bucket-list-data'}),t=el('input',{type:'password',value:c.token,placeholder:'github_pat_…'});
box.replaceChildren(el('div',{class:'card'},el('div',{class:'ctry'},'Connect to GitHub'),el('label',{},'Data repo'),r,el('label',{},'Access token'),t,
el('div',{class:'st',style:'margin-top:10px'},'Stored only in this browser and sent only to GitHub.'),
el('div',{class:'row'},el('button',{class:'btn pri',onclick:async()=>{LS.set('gh.repo',r.value.trim());LS.set('gh.token',t.value.trim());st.textContent='Checking…';const m=await pull();if(!m){box.hidden=true;startPoll()}else st.textContent=m}},'Connect'),el('button',{class:'btn',onclick:()=>box.hidden=true},'Close'),st)));box.hidden=false}
$('zs').onclick=openSetup;
(async()=>{if(!cfg().repo||!cfg().token){setSync('not connected · click ⚙');openSetup();return}await pull();startPoll()})();
</script></body></html>
